"Время, мин", "answer": "135"}], "sol": "2 · 60 + 15 = 135 (мин)."}, {"g": 2, "q": "Подготовка к празднику длилась 1 ч 45 мин. Сколько это минут?", "fields": [{"label": "Время, мин", "answer": "105"}], "sol": "1 · 60 + 45 = 105 (мин)."}, {"g": 2, "q": "Подготовка к празднику длилась 3 ч 5 мин. Сколько это минут?", "fields": [{"label": "Время, мин", "answer": "185"}], "sol": "3 · 60 + 5 = 185 (мин)."}, {"g": 2, "q": "Подготовка к празднику длилась 4 ч 20 мин. Сколько это минут?", "fields": [{"label": "Время, мин", "answer": "260"}], "sol": "4 · 60 + 20 = 260 (мин)."}, {"g": 2, "q": "Подготовка к празднику длилась 2 ч 50 мин. Сколько это минут?", "fields": [{"label": "Время, мин", "answer": "170"}], "sol": "2 · 60 + 50 = 170 (мин)."}, {"g": 3, "q": "Площадь открытки — 2 дм² 35 см². Вырази её в квадратных сантиметрах.", "fields": [{"label": "Площадь, см²", "answer": "235"}], "sol": "1 дм² = 100 см². 2 · 100 + 35 = 235 (см²)."}, {"g": 3, "q": "Площадь открытки — 4 дм² 8 см². Вырази её в квадратных сантиметрах.", "fields": [{"label": "Площадь, см²", "answer": "408"}], "sol": "1 дм² = 100 см². 4 · 100 + 8 = 408 (см²)."}, {"g": 3, "q": "Площадь открытки — 6 дм² 72 см². Вырази её в квадратных сантиметрах.", "fields": [{"label": "Площадь, см²", "answer": "672"}], "sol": "1 дм² = 100 см². 6 · 100 + 72 = 672 (см²)."}, {"g": 3, "q": "Площадь открытки — 3 дм² 5 см². Вырази её в квадратных сантиметрах.", "fields": [{"label": "Площадь, см²", "answer": "305"}], "sol": "1 дм² = 100 см². 3 · 100 + 5 = 305 (см²)."}, {"g": 3, "q": "Площадь открытки — 8 дм² 19 см². Вырази её в квадратных сантиметрах.", "fields": [{"label": "Площадь, см²", "answer": "819"}], "sol": "1 дм² = 100 см². 8 · 100 + 19 = 819 (см²)."}, {"g": 4, "q": "Сравни величины: 3 м 8 см … 380 см.", "fields": [{"label": "Знак сравнения", "answer": "<"}], "sol": "3 м 8 см = 308 см; 308 < 380."}, {"g": 4, "q": "Сравни величины: 2 кг 50 г … 2050 г.", "fields": [{"label": "Знак сравнения", "answer": "="}], "sol": "2 кг 50 г = 2050 г."}, {"g": 4, "q": "Сравни величины: 2 ч … 150 мин.", "fields": [{"label": "Знак сравнения", "answer": "<"}], "sol": "2 ч = 120 мин; 120 < 150."}, {"g": 4, "q": "Сравни величины: 5 дм² … 450 см².", "fields": [{"label": "Знак сравнения", "answer": ">"}], "sol": "5 дм² = 500 см²; 500 > 450."}, {"g": 4, "q": "Сравни величины: 4 ц 20 кг … 402 кг.", "fields": [{"label": "Знак сравнения", "answer": ">"}], "sol": "4 ц 20 кг = 420 кг; 420 > 402."}, {"g": 5, "q": "Вырази 328 см в более крупных единицах и остатке. Заполни оба поля.", "fields": [{"label": "м", "answer": "3"}, {"label": "см", "answer": "28"}], "sol": "328 см = 3 м 28 см."}, {"g": 5, "q": "Вырази 4060 г в более крупных единицах и остатке. Заполни оба поля.", "fields": [{"label": "кг", "answer": "4"}, {"label": "г", "answer": "60"}], "sol": "4060 г = 4 кг 60 г."}, {"g": 5, "q": "Вырази 185 мин в более крупных единицах и остатке. Заполни оба поля.", "fields": [{"label": "ч", "answer": "3"}, {"label": "мин", "answer": "5"}], "sol": "185 мин = 3 ч 5 мин."}, {"g": 5, "q": "Вырази 507 см² в более крупных единицах и остатке. Заполни оба поля.", "fields": [{"label": "дм²", "answer": "5"}, {"label": "см²", "answer": "7"}], "sol": "507 см² = 5 дм² 7 см²."}, {"g": 5, "q": "Вырази 3024 м в более крупных единицах и остатке. Заполни оба поля.", "fields": [{"label": "км", "answer": "3"}, {"label": "м", "answer": "24"}], "sol": "3024 м = 3 км 24 м."}, {"g": 6, "q": "У козлёнка была лента длиной 2 м 45 см. Для упаковки он отрезал 1 м 30 см. Сколько ленты осталось? Запиши ответ в сантиметрах.", "fields": [{"label": "Осталось, см", "answer": "115"}], "sol": "2 м 45 см = 245 см. 1 м 30 см = 130 см. 245 − 130 = 115 (см)."}, {"g": 6, "q": "У козлёнка была лента длиной 3 м 80 см. Для упаковки он отрезал 1 м 45 см. Сколько ленты осталось? Запиши ответ в сантиметрах.", "fields": [{"label": "Осталось, см", "answer": "235"}], "sol": "3 м 80 см = 380 см. 1 м 45 см = 145 см. 380 − 145 = 235 (см)."}, {"g": 6, "q": "У козлёнка была лента длиной 5 м 10 см. Для упаковки он отрезал 2 м 25 см. Сколько ленты осталось? Запиши ответ в сантиметрах.", "fields": [{"label": "Осталось, см", "answer": "285"}], "sol": "5 м 10 см = 510 см. 2 м 25 см = 225 см. 510 − 225 = 285 (см)."}, {"g": 6, "q": "У козлёнка была лента длиной 4 м 60 см. Для упаковки он отрезал 1 м 75 см. Сколько ленты осталось? Запиши ответ в сантиметрах.", "fields": [{"label": "Осталось, см", "answer": "285"}], "sol": "4 м 60 см = 460 см. 1 м 75 см = 175 см. 460 − 175 = 285 (см)."}, {"g": 6, "q": "У козлёнка была лента длиной 6 м 25 см. Для упаковки он отрезал 2 м 50 см. Сколько ленты осталось? Запиши ответ в сантиметрах.", "fields": [{"label": "Осталось, см", "answer": "375"}], "sol": "6 м 25 см = 625 см. 2 м 50 см = 250 см. 625 − 250 = 375 (см)."}, {"g": 7, "q": "Праздник начался в 16 ч 25 мин и закончился в 18 ч 10 мин. Сколько минут длился праздник?", "fields": [{"label": "Время, мин", "answer": "105"}], "sol": "От 16:25 до 17:25 — 60 мин, до 18:10 — ещё 45 мин. 60 + 45 = 105 (мин)."}, {"g": 7, "q": "Для подарков взяли 3 кг конфет. В каждый пакет положили по 500 г. Сколько пакетов получилось?", "fields": [{"label": "Пакетов", "answer": "6"}], "sol": "3 кг = 3000 г. 3000 : 500 = 6 (пакетов)."}, {"g": 7, "q": "Прямоугольный коврик имеет длину 3 м и ширину 2 м. Найди его площадь в квадратных дециметрах.", "fields": [{"label": "Площадь, дм²", "answer": "600"}], "sol": "3 · 2 = 6 (м²). 1 м² = 100 дм². 6 · 100 = 600 (дм²)."}, {"g": 7, "q": "На изготовление одной игрушки уходит 15 минут. Козлёнок сделал 8 игрушек. Вырази общее время в часах.", "fields": [{"label": "Время, ч", "answer": "2"}], "sol": "15 · 8 = 120 (мин). 120 : 60 = 2 (ч)."}, {"g": 7, "q": "Дорожка до ёлки имеет длину 1 км. Козлёнок прошёл 650 м. Сколько метров осталось пройти?", "fields": [{"label": "Осталось, м", "answer": "350"}], "sol": "1 км = 1000 м. 1000 − 650 = 350 (м)."}];
const names=['Длина','Масса','Время','Площадь','Сравни величины','Крупнее и мельче','Действия с величинами','Задачи'];
const rules=[
'1 см = 10 мм; 1 дм = 10 см; 1 м = 100 см; 1 км = 1000 м. При переводе в мелкие единицы умножай, в крупные — дели. Например: 2 м 7 см = 207 см.',
'1 кг = 1000 г; 1 ц = 100 кг; 1 т = 1000 кг = 10 ц. Например: 2 кг 8 г = 2008 г.',
'1 мин = 60 с; 1 ч = 60 мин; 1 сут. = 24 ч; 1 неделя = 7 суток; 1 век = 100 лет. В обычном году 365 суток, в високосном — 366. Число дней в месяце смотри в календаре.',
'1 см² = 100 мм²; 1 дм² = 100 см²; 1 м² = 100 дм² = 10 000 см²; 1 а = 100 м²; 1 га = 10 000 м²; 1 км² = 1 000 000 м². Площадь прямоугольника: длина · ширина.',
'Сначала вырази обе величины в одинаковых единицах. Затем сравни числа. Знак < означает «меньше», > — «больше», = — «равно».',
'Выдели полные крупные единицы. Остаток запиши в мелких. Например: 135 см = 1 м 35 см, а 135 мин = 2 ч 15 мин.',
'Перед сложением и вычитанием вырази величины в одинаковых единицах. После вычисления проверь единицу ответа.',
'Прочитай вопрос. Выбери нужные единицы. Запиши действия и пояснения. Для длительности найди разницу между временем окончания и начала.'
];
const KEY='lessonplay-units-4-v1';let state={screen:-1,variants:Array(8).fill(0),cards:{},drawings:{}};
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.variants&&old.cards&&old.drawings)state=old}catch(e){}
let sound=false,drawing=false,erase=false;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('#storageNotice').textContent='Память браузера недоступна. До закрытия вкладки ответы сохраняются, после закрытия могут исчезнуть.'}}
function id(){return state.screen*5+state.variants[state.screen]}
function rec(){const k=id();return state.cards[k]||(state.cards[k]={values:[],note:'',done:false,flag:false})}
function pageKey(){return state.screen<0?'home':state.screen===8?'review':String(id())}
function tone(ok){if(!sound)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?660:260;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.start();o.stop(ctx.currentTime+.2);o.onended=()=>ctx.close()}catch(e){}}
function updateNav(){let count=Object.values(state.cards).filter(r=>r.done).length;$('#count').textContent=`Выполнено: ${count} / 40`;$('#progress').value=count;$('#nav').innerHTML=[[-1,'Старт'],...names.map((n,i)=>[i,n]),[8,'Мои трудности']].map(([i,n])=>{let c=i>=0&&i<8?Array.from({length:5},(_,v)=>state.cards[i*5+v]?.done).filter(Boolean).length:0;return `<button class="${state.screen===i?'active':''}" onclick="go(${i})">${i>=0&&i<8?`${i+1}. `:''}${n}${c?` · ${c}/5${c===5?' ✓':''}`:''}</button>`}).join('')}
function go(n){state.screen=Math.max(-1,Math.min(8,n));drawing=false;save();render();window.scrollTo(0,0)}
function variant(v){state.variants[state.screen]=v;drawing=false;save();render()}
function render(){updateNav();$('#sheet').classList.remove('drawing');$('#draw').textContent='Поверх листа: выкл.';$('#back').disabled=state.screen===-1;$('#next').disabled=state.screen===8;
let c=$('#content');
if(state.screen===-1){c.innerHTML=`<div class="eyebrow">НОВОГОДНИЙ УРОК С КОЗЛЁНКОМ</div><h1>Единицы<br>измерения</h1><p>Помоги подготовить мастерскую к празднику: измерь ленты, взвесь подарки и рассчитай время.</p><span class="badge">8 тем</span><span class="badge">40 заданий</span><span class="badge">В своём темпе</span><p>Выбирай тему слева. В каждой — пять карточек. Можно заниматься по одному разделу за урок.</p><button class="primary" onclick="go(0)">Начать с длины →</button><details><summary>Как работать с листом</summary><p>Впиши ответ и нажми «Проверить». Если ошибся, измени ответ и проверь снова. «Ещё задание» меняет карточку в той же теме. Галочкой «Мне трудно» отметь то, что хочешь повторить.</p><p>В черновике рисуй пальцем, стилусом или мышью. Для записей поверх задания включи «Поверх листа». Выключи этот режим, чтобы снова вводить ответы.</p></details><h2>Памятка</h2><div class="rules">${names.slice(0,4).map((n,i)=>`<div class="rule"><b>${n}</b><p>${rules[i]}</p></div>`).join('')}</div>`}
else if(state.screen===8){const flagged=Object.entries(state.cards).filter(([k,r])=>r.flag);const total=Object.values(state.cards).filter(r=>r.done).length;c.innerHTML=`<div class="eyebrow">ПОВТОРЯЕМ СПОКОЙНО</div><h1>Мои трудности</h1><p>Выполнено ${total} из 40 карточек.</p><p>${flagged.length?'Вернись к отмеченным карточкам. Когда разберёшься, сними галочку «Мне трудно».':'Пока нет отмеченных карточек. Если задание вызывает трудности, отметь его галочкой.'}</p>${flagged.map(([k,r])=>`<div class="reviewcard"><button onclick="openCard(${k})">${names[DATA[k].g]} · карточка ${Number(k)%5+1} →</button> ${r.done?'Решено ✓':''}</div>`).join('')}`}
else{const q=DATA[id()],r=rec();c.innerHTML=`<div class="eyebrow">ТЕМА ${state.screen+1} / 8 · КАРТОЧКА ${state.variants[state.screen]+1} / 5</div><h1>${names[state.screen]}</h1><div class="variants" aria-label="Выбрать карточку">${Array.from({length:5},(_,v)=>`<button class="${v===state.variants[state.screen]?'current':''}" onclick="variant(${v})" aria-label="Карточка ${v+1}">${v+1}${state.cards[state.screen*5+v]?.done?' ✓':''}</button>`).join('')}<button onclick="variant((state.variants[state.screen]+1)%5)">Ещё задание →</button></div><p>${q.q}</p><details><summary>Вспомнить правило</summary><p>${rules[state.screen]}</p></details><div class="fields">${q.fields.map((f,i)=>`<label>${f.label}${state.screen===4?`<select class="answer" data-i="${i}" aria-label="${f.label}"><option value="">Выбери</option>${['<','=','>'].map(x=>`<option value="${esc(x)}" ${r.values[i]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input class="answer" data-i="${i}" inputmode="numeric" autocomplete="off" aria-label="${f.label}" value="${esc(r.values[i]||'')}">`}</label>`).join('')}</div><div class="actions"><button id="check" class="primary">Проверить</button><button id="sample">Подсказка</button></div><p id="feedback" class="feedback" role="status">${r.done?'Верно! Карточка выполнена.':''}</p><div id="sampleBox" class="sample hidden"></div><label class="flag"><input id="flag" type="checkbox" ${r.flag?'checked':''}> Мне трудно — повторить позже</label><h2>Моё решение</h2><textarea id="note" aria-label="Ход решения" placeholder="Запиши действия и пояснения…"></textarea><p class="muted">Ответ проверяется автоматически. Проверь пояснения по правилу.</p><h2>Черновик</h2><div class="scratchbar"><button id="scratchPen">Карандаш</button><button id="scratchErase">Ластик</button><button id="clearScratch">Очистить черновик</button><span>Цвет и толщину выбирай над листом.</span></div><canvas class="scratch" id="scratch" aria-label="Черновик для записей"></canvas>`;
$('#note').value=r.note;$('#note').oninput=e=>{r.note=e.target.value;save()};$('#flag').onchange=e=>{r.flag=e.target.checked;save()};document.querySelectorAll('.answer').forEach(el=>{el.oninput=()=>{r.values[Number(el.dataset.i)]=el.value;r.done=false;el.classList.remove('good','bad');$('#feedback').textContent='';save();updateNav()};el.onkeydown=e=>{if(e.key==='Enter')check()}});$('#check').onclick=check;$('#sample').onclick=()=>{$('#sampleBox').classList.toggle('hidden');$('#sampleBox').textContent=rules[state.screen]};$('#scratchPen').onclick=()=>{erase=false;toolLabels()};$('#scratchErase').onclick=()=>{erase=true;toolLabels()};$('#clearScratch').onclick=()=>clearDrawing('scratch');bindCanvas($('#scratch'),'scratch');}
requestAnimationFrame(()=>{bindCanvas($('#overlay'),'overlay');toolLabels()});}
function openCard(k){state.variants[Math.floor(k/5)]=k%5;go(Math.floor(k/5))}
function check(){const r=rec(),q=DATA[id()];let ok=true;document.querySelectorAll('.answer').forEach((el,i)=>{let v=el.value.trim().replace(/\s/g,'');let correct=state.screen===4?v===q.fields[i].answer:/^\d+$/.test(v)&&Number(v)===Number(q.fields[i].answer);el.classList.toggle('good',correct);el.classList.toggle('bad',!correct);ok=ok&&correct});r.done=ok;save();updateNav();$('#feedback').classList.toggle('error',!ok);$('#feedback').textContent=ok?'Верно! Карточка выполнена.':'Проверь выделенные поля. Вспомни соотношение единиц и попробуй ещё раз.';tone(ok)}
function toolLabels(){$('#pen').setAttribute('aria-pressed',!erase);$('#eraser').setAttribute('aria-pressed',erase);$('#pen').style.background=erase?'':'#d8eadb';$('#eraser').style.background=erase?'#efd5d2':'';if($('#scratchPen')){$('#scratchPen').textContent=erase?'Карандаш':'Карандаш ✓';$('#scratchErase').textContent=erase?'Ластик ✓':'Ластик'}}
function drawingKey(kind){return pageKey()+':'+kind}
function clearDrawing(kind){if(!confirm('Очистить '+(kind==='scratch'?'черновик':'рисунок поверх этой карточки')+'?'))return;state.drawings[drawingKey(kind)]=[];save();const c=$(kind==='scratch'?'#scratch':'#overlay');if(c)redraw(c,kind)}

names.splice(4,4,'Закрепление');
const practiceTitles=['Перевод единиц измерения','Умножение и деление','Порядок действий','Задачи'];
const practiceSizes=[4,4,1,4];
const keptBanks=[LENGTH,MASS,TIME,AREA],keptStores=['length','mass','time','area'];
function initPractice(){state.practice??={section:0,variants:[0,0,0,0],cards:{}}}
initPractice();if(state.screen>=5&&state.screen!==8)state.screen=4;
const previousRender=render,previousKey=pageKey,previousDrawingKey=drawingKey;
function pk(p,v){return 'R'+p+'-'+v}
function pr(p,v){return state.practice.cards[pk(p,v)]??={values:[],note:'',done:false,flag:false}}
function practiceTotal(){return PRACTICE.reduce((s,a)=>s+a.length,0)}
function activeCount(store){return Object.values(store?.cards||{}).filter(x=>x.done).length}
function allTotal(){return keptBanks.reduce((s,a)=>s+a.reduce((n,b)=>n+b.length,0),0)+practiceTotal()}
function allCount(){return keptStores.reduce((s,k)=>s+activeCount(state[k]),0)+activeCount(state.practice)}
pageKey=function(){return state.screen===4?'practice-'+state.practice.section+'-'+state.practice.variants[state.practice.section]:previousKey()};
drawingKey=function(kind){return kind.startsWith('R')?kind:previousDrawingKey(kind)};
updateNav=function(){initPractice();const total=allTotal(),count=allCount();$('#count').textContent=`Выполнено: ${count} / ${total}`;$('#progress').max=total;$('#progress').value=count;$('#nav').innerHTML=[[-1,'Старт'],...names.map((n,i)=>[i,n]),[8,'Мои трудности']].map(([i,n])=>{const c=i===4?activeCount(state.practice):i>=0&&i<4?activeCount(state[keptStores[i]]):0;const max=i===4?practiceTotal():i>=0&&i<4?keptBanks[i].reduce((s,a)=>s+a.length,0):0;return `<button class="${state.screen===i?'active':''}" onclick="go(${i})">${i>=0&&i<5?`${i+1}. `:''}${n}</button>`}).join('')};
go=function(n){state.screen=n>4?8:Math.max(-1,n);drawing=false;save();render();window.scrollTo(0,0)};
function practiceSection(p){state.practice.section=p;drawing=false;save();render();window.scrollTo(0,0)}
function practiceVariant(step){const p=state.practice.section,n=Math.ceil(PRACTICE[p].length/practiceSizes[p]);state.practice.variants[p]=(state.practice.variants[p]+step+n)%n;drawing=false;save();render();window.scrollTo(0,0)}
function openPractice(p,v){initPractice();state.practice.section=p;state.practice.variants[p]=Math.floor(v/practiceSizes[p]);go(4);document.getElementById('card'+pk(p,v))?.scrollIntoView({block:'start'})}
function practiceCheck(p,v){let ok=true;const q=PRACTICE[p][v],r=pr(p,v);document.querySelectorAll(`[data-r="${pk(p,v)}"]`).forEach((el,i)=>{const value=el.value.trim().replace(/\s/g,'');const good=/^\d+$/.test(value)&&Number(value)===Number(q.fields[i].answer);el.classList.toggle('good',good);el.classList.toggle('bad',!good);ok=ok&&good});r.done=ok;save();updateNav();const f=$('#feedback'+pk(p,v));f.textContent=ok?'Верно! Задание выполнено.':'Проверь выделенные поля. Вспомни правило и попробуй ещё раз.';f.classList.toggle('error',!ok);tone(ok)}
function practiceClear(key){if(!confirm('Очистить черновик этого задания?'))return;state.drawings[key]=[];save();redraw($('#canvas'+key),key)}
function practiceCard(p,v){const q=PRACTICE[p][v],r=pr(p,v),key=pk(p,v);return `<section class="lengthBlock" id="card${key}"><div class="lengthHead"><h2>${p===3?['Длина','Масса','Площадь','Время'][v%4]:'Пример '+(v%practiceSizes[p]+1)}</h2><span class="muted">Задание ${v+1} из ${PRACTICE[p].length}</span></div><p class="question">${esc(q.q)}</p><div class="fields">${q.fields.map((f,i)=>`<label>${esc(f.label)}<input class="answer" data-r="${key}" data-i="${i}" inputmode="numeric" autocomplete="off" aria-label="${esc(f.label)}" value="${esc(r.values[i]??'')}"></label>`).join('')}</div><div class="actions"><button class="primary" onclick="practiceCheck(${p},${v})">Проверить</button></div><p class="feedback" id="feedback${key}" role="status">${r.done?'Верно! Задание выполнено.':''}</p><details><summary>Подсказка</summary><p>${esc(q.hint)}</p></details><label class="flag"><input type="checkbox" data-rflag="${key}" ${r.flag?'checked':''}> Мне трудно — повторить позже</label><details class="practiceDraft" data-key="${key}"><summary>Моё решение и черновик</summary><textarea data-rnote="${key}" aria-label="Моё решение" placeholder="Запиши действия и пояснения…">${esc(r.note)}</textarea><p class="muted">Автоматически проверяется ответ. Пояснения проверь по правилу.</p><div class="scratchbar"><button onclick="erase=false;toolLabels()">Карандаш</button><button onclick="erase=true;toolLabels()">Ластик</button><button onclick="practiceClear('${key}')">Очистить</button><span>Цвет и толщина — над листом.</span></div><canvas class="scratch" id="canvas${key}" aria-label="Черновик задания ${v+1}"></canvas></details></section>`}
function renderReview(){let rows=[];const titles=[lengthNames,massTitles,timeTitles,areaTitles],openers=['openLength','openMass','openTime','openArea'];keptStores.forEach((store,i)=>Object.entries(state[store]?.cards||{}).forEach(([k,r])=>{if(!r.flag)return;const [p,v]=k.slice(1).split('-').map(Number);if(!keptBanks[i][p]?.[v])return;rows.push(`<div class="reviewcard"><button onclick="${openers[i]}(${p},${v})">${names[i]} · ${titles[i][p]} · ${v+1} →</button>${r.done?' ✓':''}</div>`)}));Object.entries(state.practice.cards).forEach(([k,r])=>{if(!r.flag)return;const [p,v]=k.slice(1).split('-').map(Number);rows.push(`<div class="reviewcard"><button onclick="openPractice(${p},${v})">Закрепление · ${practiceTitles[p]} · ${v+1} →</button>${r.done?' ✓':''}</div>`)});$('#content').innerHTML=`<div class="eyebrow">ПОВТОРЯЕМ СПОКОЙНО</div><h1>Мои трудности</h1><p>Выполнено ${allCount()} из ${allTotal()} заданий.</p><p>${rows.length?'Выбери задание для повторения. Когда разберёшься, сними галочку.':'Здесь появятся задания с отметкой «Мне трудно».'}</p>${rows.join('')}`}
render=function(){initPractice();if(state.screen!==4&&state.screen!==8){previousRender();if(state.screen===-1){const c=$('#content');c.innerHTML=c.innerHTML.replace('8 тем','5 разделов').replace(/\d+ примеров/,allTotal()+' заданий');const p=[...c.querySelectorAll('p')].find(x=>x.textContent.startsWith('Выбирай тему слева.'));if(p)p.textContent='Выбирай тему слева. В разделе «Закрепление» — перевод единиц, умножение и деление на однозначное число, порядок действий и задачи на длину, массу, площадь и время. Кнопка «Ещё вариант» меняет набор заданий.'}return}updateNav();$('#sheet').classList.remove('drawing');$('#draw').textContent='Поверх листа: выкл.';$('#back').disabled=false;$('#next').disabled=state.screen===8;if(state.screen===8){renderReview();requestAnimationFrame(()=>bindCanvas($('#overlay'),'overlay'));return}const p=state.practice.section,size=practiceSizes[p],variant=state.practice.variants[p],start=variant*size,total=Math.ceil(PRACTICE[p].length/size);$('#content').innerHTML=`<div class="eyebrow">ПРИМЕНЯЕМ ЗНАНИЯ · 4 КЛАСС</div><h1>Закрепление</h1><div class="lengthTabs">${practiceTitles.map((t,i)=>`<button class="${p===i?'active':''}" onclick="practiceSection(${i})">${i+1}. ${t}</button>`).join('')}</div><div class="lengthHead"><h2>${practiceTitles[p]}</h2><span>Вариант ${variant+1} из ${total}</span></div><p class="muted">${p===0?'Четыре примера: длина, масса, время и площадь.':p===1?'Два примера на умножение и два на деление. Множители и делители — только однозначные.':p===2?'Определи порядок действий и выполни вычисления в черновике.':'Четыре задачи: длина, масса, площадь и время.'} Впиши числа в указанных единицах. При отсутствии остатка впиши 0.</p><div class="actions"><button onclick="practiceVariant(-1)" aria-label="Предыдущий вариант">← Предыдущий вариант</button><button class="primary" onclick="practiceVariant(1)">Ещё вариант →</button></div>${PRACTICE[p].slice(start,start+size).map((q,i)=>practiceCard(p,start+i)).join('')}<div class="actions"><button class="primary" onclick="practiceVariant(1)">Ещё вариант →</button>${p<3?`<button onclick="practiceSection(${p+1})">Следующий пункт →</button>`:`<button onclick="go(8)">Мои трудности →</button>`}</div>`;document.querySelectorAll('[data-r]').forEach(el=>{const key=el.dataset.r,r=state.practice.cards[key];el.oninput=()=>{r.values[Number(el.dataset.i)]=el.value;r.done=false;el.classList.remove('good','bad');$('#feedback'+key).textContent='';save();updateNav()};el.onkeydown=e=>{if(e.key==='Enter'){const [p,v]=key.slice(1).split('-').map(Number);practiceCheck(p,v)}}});document.querySelectorAll('[data-rflag]').forEach(el=>el.onchange=()=>{state.practice.cards[el.dataset.rflag].flag=el.checked;save()});document.querySelectorAll('[data-rnote]').forEach(el=>el.oninput=()=>{state.practice.cards[el.dataset.rnote].note=el.value;save()});document.querySelectorAll('.practiceDraft').forEach(el=>el.ontoggle=()=>{if(el.open)bindCanvas($('#canvas'+el.dataset.key),el.dataset.key)});requestAnimationFrame(()=>{bindCanvas($('#overlay'),'overlay');toolLabels()})};
const keptBack=$('#back').onclick,keptNext=$('#next').onclick;
$('#back').onclick=()=>{if(state.screen===8)go(4);else if(state.screen===4){if(state.practice.section>0)practiceSection(state.practice.section-1);else go(3)}else keptBack()};
$('#next').onclick=()=>{if(state.screen===4){if(state.practice.section<3)practiceSection(state.practice.section+1);else go(8)}else keptNext()};
$('#restart').onclick=()=>{state={screen:-1,variants:Array(8).fill(0),cards:{},drawings:{}};initLength();initMass();initTime();initArea();initPractice();drawing=false;erase=false;sound=false;$('#sound').textContent='Звук: выключен';save();render()};
window.addEventListener('resize',()=>{document.querySelectorAll('.practiceDraft[open]').forEach(el=>redraw($('#canvas'+el.dataset.key),el.dataset.key))});
save();render();
